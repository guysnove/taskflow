# Continuous integration (Chapter 28): GitHub runs this on every push and pull request.
name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # get the code
      - uses: actions/setup-dotnet@v4        # install the .NET SDK
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore   # Course 2, Chapter 7: formatting and style, as .editorconfig says
      - run: dotnet build --no-restore -warnaserror           # Course 2, Chapter 7: analyser warnings fail the build
      - run: dotnet test --no-build --filter "Category!=Growth&Category!=E2E"   # growth timings run only on request (Course 2, Chapter 5)
      # Course 2, Chapter 18: end-to-end tests drive a real Chromium, installed here by Playwright.
      - run: pwsh TaskFlow.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-build --filter "Category=E2E"
      - run: dotnet list package --vulnerable --include-transitive   # Chapter 27: known problems in packages
