# Chapter 24: a complete, small pipeline for Ch24.Hello. Copy this folder into a new GitHub repository,
# push, and watch it run in the Actions tab. Each job is explained in the chapter.
name: pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683       # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build
      - run: dotnet publish Ch24.Hello -c Release -o publish        # a Release build, once; deployed as it is
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: hello-${{ github.sha }}
          path: publish/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683       # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: hello-${{ github.sha }}
          path: release
      - run: APP_DLL=Ch24.Hello.dll bash deploy.sh "$RUNNER_TEMP/server" release "${GITHUB_SHA::7}" "Greeting=${{ vars.GREETING || 'Hello' }}"
      - run: curl --fail --silent http://127.0.0.1:5040/
