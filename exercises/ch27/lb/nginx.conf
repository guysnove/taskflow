# Chapter 27: a load balancer. Requests to port 80 go to the copies of "app", taking turns (round robin).
events {}
http {
  access_log off;
  upstream counter {
    server app:8080;           # Docker's DNS answers with EVERY copy's address; nginx uses them all
  }
  server {
    listen 80;
    location / { proxy_pass http://counter; }
  }
}
