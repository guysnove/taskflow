# Chapter 29: nginx in front of TaskFlow (HTTPS here, plain HTTP to the app on 127.0.0.1:5000).
# (Not run in the video: shown as a typical example. Certificates from Let's Encrypt, e.g. with certbot.)
server {
    listen 443 ssl;
    server_name taskflow.example;
    ssl_certificate     /etc/letsencrypt/live/taskflow.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskflow.example/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name taskflow.example;
    return 301 https://$host$request_uri;   # plain HTTP: send browsers to HTTPS
}
